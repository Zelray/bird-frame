<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" id="svg36" width="951.5" height="405.5" fill="#2b2b2b" aria-labelledby="title desc" font-family="system-ui, '-apple-system', 'Segoe UI', sans-serif" font-size="14" role="img" version="1.1" viewBox="0 0 951.5 405.5"><title id="title">Where each screen gets its picture</title><desc id="desc">The detections and settings feed two renders. The render loop draws the panel&apos;s page, dithered and paced by Panel refresh; it goes to the Inky panel, frame.png and /frame.e6 for the external e-ink panel. The web render draws the web page on request in full colour; it is served as /collage.png to the browser kiosk, the Samsung Frame TV and the macOS wallpaper, and as the admin preview.</desc><defs id="defs1"><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path id="path1" fill="#555" d="M 0,0 10,5 0,10 Z"/></marker><marker id="arrow-5" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path id="path1-5" fill="#555" d="M 0,0 10,5 0,10 Z"/></marker><marker id="arrow-3" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path id="path1-9" fill="#555" d="M 0,0 10,5 0,10 Z"/></marker></defs><rect id="rect15-3" width="200" height="44" x=".75" y="180.75" fill="#e9efe6" rx="6" style="fill:#fff;fill-opacity:1;stroke:#555;stroke-width:1.5"/><rect id="rect15-5" width="200" height="65" x="250.75" y="290.75" fill="#e9efe6" rx="6" style="stroke:#555;stroke-width:1.5"/><rect id="rect18-8" width="200" height="65" x="250.75" y="50.75" fill="#f3ebdd" rx="6" style="stroke:#555;stroke-width:1.5"/><path id="path2" d="m 200.75,202.75 h 25 V 83.25 h 24" style="fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)"/><path id="path3" d="m 200.75,202.75 h 25 l -1,120.5 h 25" style="fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)"/><path id